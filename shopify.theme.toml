# Won theme dev environments for this repo.
# Usage: `shopify theme dev -e horizon`  (client track)
#        `shopify theme dev -e skeleton` (product track)
# The composed themes live in themes/dist/<base>-dev (regenerated by
# `node themes/build/compose.mjs <base>`), so store + path load automatically.

[environments.horizon]
store = "b2b-b2c-store-development.myshopify.com"
path = "themes/dist/horizon-dev"

[environments.skeleton]
store = "b2b-b2c-store-development.myshopify.com"
path = "themes/dist/skeleton-dev"
