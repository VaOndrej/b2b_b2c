# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2c3e1a8e739b256784c30bfcefd0ec90"
name = "Won Toasts"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  # GDPR/compliance webhooks are configured via their dedicated block (NOT as
  # regular subscriptions). Handlers: webhooks.customers.redact / .data_request /
  # webhooks.shop.redact.
  [webhooks.privacy_compliance]
  customer_deletion_url = "/webhooks/customers/redact"
  customer_data_request_url = "/webhooks/customers/data_request"
  shop_deletion_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # BILL-1: reconcile the stored plan when Shopify's subscription state changes
  # (cancel/expire/freeze → Free), so a lapsed merchant can't keep Pro on the
  # storefront until they next open the Plan page.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # MVP11 order.summary aggregate + MVP12 social proof read orders/create. That
  # topic carries protected customer data, so it needs "Protected customer data
  # access" approved in the Partner Dashboard (App → API access) before it can be
  # registered — otherwise `shopify app dev` refuses to start the preview.
  # Handler (webhooks.orders.create.tsx) is ready; re-enable this block once the
  # access is granted. Until then, order.summary + Recent sales stay dormant
  # (empty feeds — cold-start honest), everything else works.
  # [[webhooks.subscriptions]]
  # topics = [ "orders/create" ]
  # uri = "/webhooks/orders/create"

[access_scopes]
# Minimum scopes (API-2). Path A launch (2026-08-13): only read_themes — MVP6
# app-embed auto-detection from config/settings_data.json (gracefully optional;
# without it the merchant enables the embed manually).
# write_products + read_orders are DEFERRED together with every order/product-data
# feature (order.summary, social proof, popularity metafields) — all of which need
# "Protected customer data access" approved in the Partner Dashboard. Re-add both
# once granted to light those up together (also uncomment the orders/create block).
scopes = "read_themes"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[app_proxy]
url = "https://example.com/won-toasts"
subpath = "won-toasts"
prefix = "apps"
