api_version = "2026-04"

[[extensions]]
name = "t:name"
handle = "won-discounts-engine"
type = "function"
uid = "f40d0f78-3d15-1474-b4b1-791610e3a3593f0ccc53"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  [[extensions.targeting]]
  target = "cart.delivery-options.discounts.generate.run"
  input_query = "src/cart_delivery_options_discounts_generate_run.graphql"
  export = "cart-delivery-options-discounts-generate-run"

  # Input query variables are read ONLY from this metafield on the function
  # owner (the discount node): the node's small `function_vars` (@won/core
  # buildNodeVars). Its top-level keys campaignStart/campaignEnd map to the
  # query variables (missing → InvalidVariableValueError, C4); role, ruleId,
  # campaignId and varsVersion are read via `discount.vars` in the input
  # queries. The shared config is the SHOP metafield `function_config` (C7).
  [extensions.input.variables]
  namespace = "$app:won_discounts"
  key = "function_vars"

  # Rust (production hot path; the TS engine in @won/core stays the reference,
  # README.md). Needs cargo on PATH: `export PATH="$HOME/.cargo/bin:$PATH"`.
  [extensions.build]
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/won-discounts-engine.wasm"
  watch = ["src/**/*.rs"]
