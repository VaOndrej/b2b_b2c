# Input query variables come from the discount's `$app:won_discounts` /
# `function_config` metafield: its top-level keys map to variable names.
#
# CONTRACT: every `function_config` MUST contain top-level `campaignStart` and
# `campaignEnd` (DateTimeWithoutTimezone in shop-local time, e.g.
# "2026-09-28T14:00:00"; use "1970-01-01T00:00:00" for both when there is no
# campaign). Shopify docs: a key missing from the metafield (or a missing
# metafield) is passed as null, and null for a `!` variable makes the function
# execution fail, in every mode: no discount, checkout is not blocked. Whether
# the query defaults below are applied instead is platform behaviour to settle
# in C4. `campaignStarted` separates "window not started" from "variables not
# bound" (the 1970 default is always started).
query CartInput(
  $campaignStart: DateTimeWithoutTimezone! = "1970-01-01T00:00:00"
  $campaignEnd: DateTimeWithoutTimezone! = "1970-01-01T00:00:00"
) {
  triggeringDiscountCode
  enteredDiscountCodes {
    code
    rejectable
  }
  discount {
    discountClasses
    metafield(namespace: "$app:won_discounts", key: "function_config") {
      jsonValue
    }
  }
  shop {
    localTime {
      date
      campaignActive: dateTimeBetween(
        startDateTime: $campaignStart
        endDateTime: $campaignEnd
      )
      campaignStarted: dateTimeAfter(dateTime: $campaignStart)
    }
  }
  cart {
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
        compareAtAmountPerQuantity {
          amount
        }
      }
      gift: attribute(key: "_won_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            wonProduct: metafield(namespace: "$app:won_discounts", key: "product") {
              jsonValue
            }
          }
        }
      }
    }
  }
  localization {
    country {
      isoCode
    }
  }
}
