# Input query variables come from the discount's `$app:won_discounts` /
# `function_config` metafield: its top-level keys map to variable names.
#
# CONTRACT: every `function_config` MUST contain top-level `campaignStart` and
# `campaignEnd` (DateTimeWithoutTimezone in shop-local time, e.g.
# "2026-09-28T14:00:00"; use "1970-01-01T00:00:00" for both when there is no
# campaign). Settled on the platform by C4
# (docs/won-discounts/evidence/mvp0/c4-campaign-window.json): a key missing
# from the metafield, or a missing metafield, fails the run with
# InvalidVariableValueError before any JS runs, in every mode: the node gives
# no discount at all (checkout is not blocked). The `= "1970-..."` defaults
# below are NOT applied by the platform; never rely on them. The local runner
# (`shopify app function run`) binds no variables and cannot reproduce this.
# @won/core/discounts/function-config encodeFunctionConfig always writes both
# keys. `campaignStarted` separates "window not started" from "variables not
# bound" (the 1970 value is always started).
query CartInput(
  $campaignStart: DateTimeWithoutTimezone! = "1970-01-01T00:00:00"
  $campaignEnd: DateTimeWithoutTimezone! = "1970-01-01T00:00:00"
) {
  triggeringDiscountCode
  enteredDiscountCodes {
    code
    rejectable
  }
  discount {
    discountClasses
    metafield(namespace: "$app:won_discounts", key: "function_config") {
      jsonValue
    }
  }
  shop {
    localTime {
      date
      campaignActive: dateTimeBetween(
        startDateTime: $campaignStart
        endDateTime: $campaignEnd
      )
      campaignStarted: dateTimeAfter(dateTime: $campaignStart)
    }
  }
  cart {
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
        compareAtAmountPerQuantity {
          amount
        }
      }
      gift: attribute(key: "_won_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            wonProduct: metafield(namespace: "$app:won_discounts", key: "product") {
              jsonValue
            }
          }
        }
      }
    }
  }
  localization {
    country {
      isoCode
    }
  }
}
