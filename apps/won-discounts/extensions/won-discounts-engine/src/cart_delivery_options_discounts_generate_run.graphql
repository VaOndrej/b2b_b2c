# Engine input, delivery target: the same plan as the lines target (the
# shipping winner depends on the lines), emitted on every delivery group.
# campaignStart/campaignEnd MUST be top-level keys of the node's function_vars
# (CONTRACT, README.md "Input query"). Shopify counts EVERY character of this
# file, comments included, against its 3000-character limit.
#
# Cost (shopify.dev input query cost table): 30 of 30.
query Input(
  $campaignStart: DateTimeWithoutTimezone!
  $campaignEnd: DateTimeWithoutTimezone!
) {
  triggeringDiscountCode
  enteredDiscountCodes {
    code
  }
  discount {
    vars: metafield(namespace: "$app:won_discounts", key: "function_vars") {
      jsonValue
    }
  }
  shop {
    config: metafield(namespace: "$app:won_discounts", key: "function_config") {
      jsonValue
    }
    localTime {
      date
      campaignActive: dateTimeBetween(
        startDateTime: $campaignStart
        endDateTime: $campaignEnd
      )
    }
  }
  localization {
    country {
      isoCode
    }
    language {
      isoCode
    }
  }
  presentmentCurrencyRate
  cart {
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    deliveryGroups {
      id
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      gift: attribute(key: "_won_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          wonVariant: metafield(namespace: "$app:won_discounts", key: "variant") {
            jsonValue
          }
          wonOutlet: metafield(namespace: "$app:won_discounts", key: "outlet") {
            jsonValue
          }
          product {
            id
            wonProduct: metafield(namespace: "$app:won_discounts", key: "product") {
              jsonValue
            }
          }
        }
      }
    }
  }
}
