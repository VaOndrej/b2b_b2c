# Won Discounts — Fly.io (MVP 7, A13). PREPARED, NOT DEPLOYED. Deploy from the REPO ROOT:
#   fly deploy -c apps/won-discounts/fly.toml
# Rename `app` to the real Fly app name and set `primary_region`. Steps and secrets: DEPLOY.md.
app = "won-discounts"
primary_region = "fra"   # Frankfurt (EU)

[build]
  dockerfile = "apps/won-discounts/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"

# Apply DB migrations once, before each release rolls out.
[deploy]
  release_command = "sh -c 'cd /repo/apps/won-discounts && npx prisma migrate deploy'"

[http_service]
  internal_port = 3000
  force_https = true
  # ONE machine, always on: the config lock, the per-shop sync queue, the cost mirror and the scheduler
  # (sales ending by date, campaign boundaries, billing reconcile) live in the process (DEPLOY.md, "One instance").
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
