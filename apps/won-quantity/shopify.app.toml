# Won Quantity owns a separate Shopify app record and proxy namespace.
# `config:link` fills client_id for that record; never reuse B2Bcommerce here.

client_id = "10e552cef98e26a4fa6c5df4e2c843fa"
name = "Won Quantity"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Adjust to what your app actually needs.
scopes = "read_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[app_proxy]
url = "https://example.com/won-quantity"
subpath = "won-quantity"
prefix = "apps"
